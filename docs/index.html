<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ไม่ส่งที่อยู่หน้าเว็บไปให้เว็บอื่น -->
<meta name="referrer" content="no-referrer">
<!-- CSP: อนุญาตเฉพาะสคริปต์ของเราเอง / ฟอนต์ Google / รูปจาก Google Drive / เรียก API ไป Apps Script เท่านั้น -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://drive.google.com https://*.googleusercontent.com; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>รวมระบบงาน ป.</title>
<!-- ติดตั้งเป็นแอปบนหน้าจอหลัก (PWA แบบพื้นฐาน ไม่มี service worker) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D2B6B">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ระบบงาน ป.">
<link rel="icon" type="image/png" href="icon/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
<style>
/* ===== ค่าพื้นฐาน / สี (ธีมน้ำเงิน-เหลือง ดีไซน์ v3.0) ===== */
:root{
  --hdr:#0D2B6B; --pri:#1A4FA8; --pri-soft:#DCEBFA;
  --txt:#0D2B6B; --mut:#5B6F86; --line:#CFE0F1;
  --yel:#FFD400; --yel-l:#FFE35C; --yel-g:linear-gradient(120deg,#FFD400,#FFC400 55%,#FFE35C);
  --ok:#1B7F4B; --ok-bg:#E3F5EA; --err:#C62828; --nav-h:64px;
  --gut:16px; --pad-b:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));
  --page-grad:linear-gradient(180deg,#0D2B6B 0%,#1A4FA8 22%,#6E9BDB 45%,#D9E6F7 68%,#F7FAFE 100%);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* html สีน้ำเงินเข้ม: ตอนดึงเลยขอบบนจะไม่เห็นแถบขาว */
html{background:#0D2B6B;overscroll-behavior-x:none;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
/* พื้นหลังไล่เฉดวาดครั้งเดียวสูงเท่าหน้าจอ เริ่มที่ขอบบนของหน้า (ไม่ใช้ fixed เพราะ iOS จะกระตุก) ใต้ลงไปเป็นสีอ่อน
   ข้อความที่อยู่บนพื้นตรงๆ มีเฉพาะส่วนบนของหน้า ส่วนที่เหลืออยู่ในการ์ดขาวทั้งหมด */
body{font-family:'Prompt',system-ui,-apple-system,'Segoe UI','Noto Sans Thai',Tahoma,sans-serif;background-color:#F7FAFE;background-image:var(--page-grad);background-repeat:no-repeat;background-position:0 0;background-size:100% 100vh;color:var(--txt);font-size:16px;line-height:1.5;overflow-x:hidden;min-height:100vh;overscroll-behavior-x:none}
@supports (height:100svh){body{background-size:100% 100svh}}
[hidden]{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--txt)}
h1,h2,h3,p{margin:0}
a{color:inherit}
body.no-scroll{overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mi{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;flex:none;user-select:none}
/* ฟอนต์ไอคอนใช้ display=swap: ระหว่างรอโหลดให้ซ่อนชื่อไอคอนที่เป็นตัวอักษรและจองที่ไว้ 1em กันหน้ากระโดด */
html:not(.icons-ready):not(.icons-fallback) .mi{visibility:hidden;width:1em;overflow:hidden}
/* ฟอนต์ไอคอนโหลดไม่ได้: ใช้ SVG สำรอง (สร้างด้วย JS) ขนาดตาม font-size เดิมของ .mi */
html.icons-fallback .mi{width:1em;height:1em;overflow:visible}
.mi svg{display:block;width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--mut)}

/* ===== header ===== */
#hdr{position:sticky;top:0;z-index:30;background:var(--hdr);color:#fff;padding-top:env(safe-area-inset-top);border-bottom:1px solid rgba(255,255,255,.12)}
.hdr-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 6px 10px 16px;min-height:68px}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--hdr);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.logo-img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
.hdr-txt{flex:1;min-width:0}
.hdr-sm{font-size:12px;line-height:1.25;color:#FFE35C;font-weight:500}
.hdr-big{font-size:20px;font-weight:600;line-height:1.25;color:#FFD400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-btn{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;transition:transform .15s ease}
.hdr-btn:active{background:rgba(255,255,255,.25);transform:scale(.98)}
.hdr-btn.admin-on{background:rgba(255,255,255,.25)}
/* จุดแจ้งเตือนสีเหลืองบนกระดิ่ง (แสดงจำนวนที่ยังไม่อ่าน) */
.badge{position:absolute;top:3px;right:1px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--yel);color:#0D2B6B;font-size:12px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--hdr)}

/* ===== โครงหน้า ===== */
.wrap{max-width:960px;margin:0 auto;padding:12px var(--gut) 0}
#main{padding-bottom:var(--pad-b)}
.view{display:none}
.view.active{display:block;animation:vin .2s ease-out}
@keyframes vin{from{opacity:0}to{opacity:1}}
.sec-title{font-size:18px;font-weight:600;margin:6px 0 10px;color:#fff}
.form-card .sec-title{color:var(--txt)}
.card{background:#fff;border-radius:18px;border:1px solid rgba(207,224,241,.7);box-shadow:0 2px 10px rgba(13,43,107,.08)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.card-head h2{font-size:18px;font-weight:600;color:var(--txt)}

/* ===== hero card: วัน/วันที่/นาฬิกา ===== */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--yel-g);margin-bottom:12px;min-height:128px;display:flex;align-items:center;--hero-fg:#0D2B6B;--hero-sub:#3D4F78}
.hero.light{--hero-fg:#fff;--hero-sub:rgba(255,255,255,.9)}
/* แสงวงกลมขาวจางมุมขวาบน (ไม่ใช้ blur) */
.hero::before{content:'';position:absolute;right:-40px;top:-56px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.28);pointer-events:none}
.hero.has-img::before{display:none}
.hero-img{position:absolute;left:0;top:0;right:0;bottom:0;background-size:cover;background-position:center}
.hero-ov{position:absolute;left:0;top:0;right:0;bottom:0}
.hero-in{position:relative;width:100%;padding:16px 18px;min-width:0}
.hero.has-img.dark .hero-in{text-shadow:0 0 10px rgba(255,255,255,.8)}
.hero.has-img.light .hero-in{text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero-day{font-size:14px;font-weight:500;color:var(--hero-sub);line-height:1.3}
.hero-date{font-size:20px;font-weight:600;color:var(--hero-fg);line-height:1.3;overflow-wrap:anywhere}
.hero-time{display:flex;align-items:baseline;gap:4px;color:var(--hero-fg);margin-top:2px}
.hero-hm{font-size:52px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-sec{font-size:18px;font-weight:500;color:var(--hero-sub);font-variant-numeric:tabular-nums}

/* ===== ข้อความวิ่ง ===== */
.ticker{display:flex;align-items:center;gap:8px;background:#FFF6CC;color:#0D2B6B;border-radius:12px;padding:0 12px;height:44px;margin-bottom:12px;overflow:hidden}
.ticker .mi{color:#0D2B6B}
.tk-view{flex:1;overflow:hidden;white-space:nowrap;height:100%;display:flex;align-items:center;min-width:0}
.tk-run{display:inline-block;padding-left:100%;animation:tk 20s linear infinite;font-size:15px;font-weight:500}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* ===== แบนเนอร์ประชาสัมพันธ์ ===== */
.banner-wrap{position:relative;margin-bottom:8px}
.banner-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none;overscroll-behavior-x:contain}
.banner-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;height:150px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;background:linear-gradient(135deg,#2D6ECF,#0D2B6B);text-align:left}
.slide.link{cursor:pointer}
/* แสงวงกลมขาวจางมุมขวาบน (ไม่ใช้ blur) */
.slide::before{content:'';position:absolute;right:-40px;top:-56px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.slide-img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
/* แผ่นสีทับรูป: สีและความเข้มปรับได้ต่อแบนเนอร์ */
.slide-ov{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.slide.has-img{align-items:flex-end}
.slide.has-img::before{display:none}
.slide.has-img::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5));pointer-events:none}
.slide-txt{position:relative;z-index:1;width:100%;padding:14px 18px;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.slide-t{font-size:20px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.slide-s{font-size:14px;margin-top:2px;overflow-wrap:anywhere;opacity:.95}
/* แถบจุดอยู่ใต้การ์ด (ไม่ทับข้อความ) */
.banner-dots{position:static;transform:none;margin-top:0;display:flex;justify-content:center;flex-wrap:wrap;gap:0}
.banner-dots:empty{display:none}
/* ปุ่มกด 48x48 โปร่งใส; ตัวจุดจริงคือ ::after (กว้างคงที่ 20px ยืดหดด้วย scaleX) */
.dot-b{width:48px;height:48px;min-width:48px;min-height:48px;padding:0;background:transparent;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dot-b::after{content:'';width:20px;height:8px;border-radius:10px/4px;background:rgba(13,43,107,.35);transform:scaleX(.4);transition:transform .2s ease,opacity .2s ease;opacity:.7}
.dot-b.on::after{transform:none;background:#0D2B6B;opacity:1}

/* ===== วงกลมสีเรียบ + เงายาว (long shadow) ด้วย CSS ล้วน: pseudo-element + transform ไม่ใช้ filter/blur =====
   แถบดำโปร่ง ~18% เริ่มจากกลางวงไปมุมขวาล่าง 45° ถูกตัดด้วยขอบวงกลม (overflow hidden) ไอคอน/รูปอยู่เหนือเงา */
.ls{position:relative;overflow:hidden;border-radius:50%;background:var(--c,#1A4FA8);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ls::before{content:'';position:absolute;left:50%;top:50%;width:100%;height:68%;margin-top:-34%;background:rgba(0,0,0,.18);transform-origin:0 50%;transform:rotate(45deg);pointer-events:none}
.ls>.mi,.ls>.ls-img{position:relative;z-index:1}
.ls-img{width:60%;height:60%;object-fit:contain;display:block}

/* ===== การ์ดระบบงาน ===== */
.sys-card{padding-bottom:8px;margin-bottom:6px}
.sys-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 4px;padding:6px 8px 6px}
.sys-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;min-height:96px;border-radius:12px;text-align:center}
.sys-ico{width:58px;height:58px;transition:transform .15s ease}
.sys-item:active .sys-ico{transform:scale(.98)}
.sys-ico .mi{font-size:30px}
.sys-lbl{font-size:12px;line-height:1.3;font-weight:500;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;overflow-wrap:anywhere;width:100%}
.sys-item.nolink .sys-lbl{color:var(--mut)}
.sys-note{font-size:12px;line-height:1.2;color:var(--mut);margin-top:-4px;font-weight:500}
.fld-count{font-size:12px;color:var(--mut);text-align:right;margin-top:4px}
/* ปุ่ม + เพิ่มระบบ (admin) เป็นวงเหลือง */
.sys-add .sys-ico{--c:#FFD400;color:#0D2B6B}
.sys-add .sys-lbl{font-weight:600}
.ver-line{text-align:center;color:var(--mut);font-size:12px;padding:12px 0 4px}

/* ===== รายการแถว (เอกสาร / ค้นหา / ตั้งค่า) ===== */
.card-list{background:#fff;border-radius:18px;border:1px solid var(--line);overflow:hidden;box-shadow:0 2px 10px rgba(13,43,107,.08)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:64px;border-bottom:1px solid #E6EFF8;width:100%}
.row:last-child{border-bottom:0}
button.row{transition:transform .15s ease}
button.row:active{background:#F2F8FE;transform:scale(.98)}
.lead{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;overflow:hidden}
.lead img{width:100%;height:100%;object-fit:cover;display:block}
.lead .ls-img{width:60%;height:60%;object-fit:contain}
.row-txt{flex:1;min-width:0}
.row-t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.row-s{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.dl-btn{width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;position:relative;transition:transform .15s ease}
.dl-btn:active{transform:scale(.98)}
.empty{text-align:center;color:var(--mut);padding:28px 16px;background:#fff;border-radius:18px;border:1px solid var(--line)}
.empty .mi{font-size:40px;display:block;margin:0 auto 6px;color:#9DB6D0}

/* ===== หน้าติดต่อ ===== */
.c-card{background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(13,43,107,.08);padding:14px;margin-bottom:12px}
.c-top{display:flex;align-items:center;gap:12px}
.c-name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.c-pos{font-size:14px;color:var(--mut);overflow-wrap:anywhere}
.c-phone{font-size:14px;color:var(--txt);overflow-wrap:anywhere}
.c-acts{display:flex;gap:10px;margin-top:12px}
.c-acts .btn{flex:1}
.btn-call{background:var(--pri);color:#fff}
.btn-line{background:#00873D;color:#fff}

/* ===== ปุ่มทั่วไป (สูงอย่างน้อย 48px) ===== */
.btn{min-height:52px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;text-align:center;text-decoration:none;transition:transform .15s ease}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--pri);color:#fff}
.btn-outline{background:#fff;color:var(--pri);border:1px solid #B7C9E4}
.btn-danger{background:var(--err);color:#fff}
.btn-block{width:100%}
.btn:disabled,.ab:disabled{opacity:.55;cursor:default}
.is-loading{color:transparent!important;pointer-events:none}
.is-loading .mi,.is-loading span{color:transparent!important}
.is-loading::after{content:'';position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid rgba(120,140,160,.4);border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite}
.btn-primary.is-loading::after,.btn-danger.is-loading::after,.dl-btn.is-loading::after{border-color:rgba(255,255,255,.45);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== ช่องค้นหา ===== */
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:0 12px;min-height:54px;margin-bottom:12px}
.search-box:focus-within{border-color:var(--pri)}
.search-box input{flex:1;border:0;outline:0;background:transparent;min-height:50px;min-width:0}
.search-box .mi{color:var(--mut)}

/* ===== แจ้งเตือน ===== */
.n-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(13,43,107,.08)}
.n-top{display:flex;align-items:center;gap:8px}
.n-top h3{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;background:#D93025;flex:none}
.n-card p{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.n-card time{display:block;margin-top:8px;font-size:12px;color:var(--mut)}

/* ===== ตั้งค่า / admin ===== */
.admin-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;font-weight:600;font-size:14px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px;border-bottom:1px solid #E6EFF8;background:#fff}
.menu-item:last-child{border-bottom:0}
.menu-item:active{background:#F2F8FE}
.menu-item .lead{background:var(--pri-soft);color:var(--pri)}
.menu-item .m-t{flex:1;font-weight:500;font-size:16px}
.menu-item .mi.chev{color:#8AA3BD}
.sub-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.sub-bar h2{font-size:19px;font-weight:600;color:#fff}
.back-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--pri);background:#fff;border:1px solid var(--line)}
.adm-row{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(13,43,107,.08)}
.adm-main{display:flex;align-items:center;gap:12px}
.adm-name{font-weight:600;overflow-wrap:anywhere}
.adm-sub{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.tag-off{display:inline-block;font-size:12px;font-weight:500;background:#E6EAEF;color:#51606F;border-radius:10px;padding:0 8px;margin-left:6px;vertical-align:middle}
.adm-acts{display:flex;gap:6px;margin-top:10px}
.ab{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:#F5F9FE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:12px;font-weight:500;color:var(--pri);position:relative}
.ab .mi{font-size:22px}
.ab.del{color:var(--err);border-color:#F1C9C9;background:#FFF5F5}
/* ปุ่มเพิ่มอยู่บนพื้นน้ำเงิน จึงใส่ขอบขาวให้เห็นชัด */
.add-wide{margin-bottom:14px;border:2px solid #fff}
.form-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(13,43,107,.08)}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;min-height:48px;border-radius:12px;border:1px solid #B7C9E4;background:#fff;font-weight:500;text-align:center}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* ปุ่มเลือกช่วงวันที่หน้าสถิติอยู่บนพื้นน้ำเงิน ใช้สีเหลืองบอกตัวที่เลือก */
#subBody>.seg button.on{background:var(--yel);color:#0D2B6B;border-color:var(--yel)}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
#subBody>.hint{color:var(--mut);text-align:center}
.stat-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat-num{font-size:30px;font-weight:600;color:var(--pri);line-height:1.2}
.stat-lbl{font-size:13px;color:var(--mut)}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:10px;align-items:center}
.bar-name{font-size:14px;overflow-wrap:anywhere}
.bar-cnt{font-weight:600;font-size:14px}
.bar-track{grid-column:1/-1;height:12px;background:#E6EFF8;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--pri);border-radius:6px}
.split{display:flex;height:22px;border-radius:11px;overflow:hidden;background:#E6EFF8;margin:6px 0 8px}
.split i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.legend b{font-weight:600}
.sw-dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:6px;vertical-align:middle}
.loading-block{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:#fff}
.spinner{width:24px;height:24px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.skel{background:#E3ECF7;border-radius:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.skel-grid-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.skel-circle{width:58px;height:58px;border-radius:50%}
.skel-line{width:48px;height:12px}

/* ===== bottom nav (fixed) พื้นขาว ===== */
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid #E1E9F4;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--nav-h)}
.nav-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#7A8BA8;font-size:12px;font-weight:500;position:relative;text-align:center;transition:transform .15s ease}
.nav-b:active{transform:scale(.98)}
.nav-b.on{color:#1A4FA8;font-weight:600}
.nav-fab{justify-content:flex-start}
.fab{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#2D6ECF,#0D2B6B);color:#fff;margin-top:-34px;border:4px solid #fff;box-shadow:0 2px 8px rgba(13,43,107,.28);display:flex;align-items:center;justify-content:center}
.fab .mi{font-size:30px}
.nav-fab .nav-lbl{margin-top:2px}

/* ===== modal ===== */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:rgba(10,30,55,.55);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.m-head{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 18px;background:linear-gradient(180deg,#0D2B6B,#1A4FA8);color:#fff;min-height:60px}
.m-head h3{flex:1;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.m-x{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.m-body{padding:16px 18px;overflow-y:auto;overscroll-behavior:contain}
.m-body .pre{white-space:pre-wrap;overflow-wrap:anywhere}
.m-foot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.m-foot .btn{flex:1}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-weight:500;margin-bottom:6px;font-size:15px}
.inp{width:100%;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
textarea.inp{min-height:110px;resize:vertical}
.inp:focus{outline:none;border-color:var(--pri)}
.icon-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ic-b{height:48px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.ic-b.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
/* ตารางเลือกสี: ชุดสำเร็จรูป + ช่องกำหนดเอง (input type=color) */
.color-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col-b{position:relative;height:48px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid transparent;overflow:hidden;cursor:pointer}
.col-b .mi{opacity:0}
.col-b.sel{border-color:#0D2B6B}
.col-b.sel .mi{opacity:1}
.col-b.col-def{background:var(--yel-g);color:#0D2B6B;font-size:13px;font-weight:600}
.col-b.col-def .col-def-t{font-size:13px}
.col-b.col-custom{background:conic-gradient(#EF6F6C,#F6B93B,#2E9E5B,#4FC1C8,#1A4FA8,#7B3FB5,#EF6F6C)}
.col-b.col-custom .mi{opacity:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cp-input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw-row{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:500;margin-bottom:6px}
.sw-row input{width:26px;height:26px;accent-color:var(--pri);flex:none}
.popup-skip{display:flex;align-items:center;gap:10px;min-height:48px;margin-top:10px;font-size:14px;color:var(--mut);width:100%}
.popup-skip .mi{color:var(--pri)}
.img-prev{position:relative;overflow:hidden;width:100%;height:150px;border-radius:12px;background-size:cover;background-position:center;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);margin-bottom:8px}
.img-prev .ov-layer{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.img-acts{display:flex;gap:8px}
.img-acts .btn{flex:1;min-height:48px}
.prev-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.prev-row .ls{width:64px;height:64px}
.prev-row .ls .mi{font-size:32px}
.logo-prev{width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid var(--line);color:var(--hdr);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.logo-prev .logo-img{padding:4px}
.rng-row{display:flex;align-items:center;gap:12px;min-height:48px}
.rng{flex:1;min-width:0;height:48px;accent-color:var(--pri);margin:0}
.rng-val{min-width:46px;text-align:right;font-weight:600}

/* ===== แป้น PIN ตัวเลข ===== */
.pin-modal{max-width:360px}
.pin-head{position:relative;background:linear-gradient(180deg,#0D2B6B,#1A4FA8);padding:22px 16px 18px;text-align:center;color:#fff}
.pin-head .m-x{position:absolute;right:4px;top:4px}
.pin-key{width:56px;height:56px;border-radius:50%;background:var(--yel);color:#0D2B6B;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.pin-head h3{font-size:20px;font-weight:600;color:#FFD400}
.pin-sub{font-size:14px;color:#D6E4F7}
.pin-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;min-height:16px;margin-top:14px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:#FFD400;animation:dotin .14s ease-out}
@keyframes dotin{from{transform:scale(.4);opacity:.4}to{transform:none;opacity:1}}
.pin-dots.shake{animation:shake .36s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px 22px;justify-content:center;padding:20px 16px 10px}
.pk{width:64px;height:64px;border-radius:50%;background:#EEF4FC;color:#0D2B6B;font-size:26px;font-weight:500;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .12s ease}
.pk:active{transform:scale(.95);background:#DCEBFA}
.pk-text{background:transparent;font-size:14px;font-weight:500;color:#5B6F86}
.pk-icon{background:transparent;color:#5B6F86}
.pk-icon .mi{font-size:28px}
.pin-foot{padding:8px 18px calc(18px + env(safe-area-inset-bottom))}

/* ===== toast ===== */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;max-width:480px;background:#fff;color:#0D2B6B;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.18);padding:12px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:15px;font-weight:500;animation:tin .2s ease-out}
.toast.success{background:var(--ok);color:#fff;border-color:var(--ok)}
.toast.error{background:var(--err);color:#fff;border-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== ลดการเคลื่อนไหว: ปิด animation / transition ทั้งหมด ===== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .tk-run{padding-left:0;white-space:normal}
  .tk-view{white-space:normal;line-height:1.25}
  .ticker{height:auto;min-height:44px;padding-top:6px;padding-bottom:6px}
}

/* ===== responsive (วางท้ายไฟล์เพื่อไม่ให้ถูกทับ) ===== */
@media (min-width:600px){
  .ov{align-items:center}
  .modal{border-radius:20px}
}
/* PC: เนื้อหาทั้งหมดอยู่ในคอลัมน์กลางกว้าง 480px (พื้นหลังไล่เฉดยังเต็มจอ) */
@media (min-width:768px){
  :root{--gut:16px}
  .hdr-in,.wrap{max-width:480px;margin:0 auto}
  .hdr-in{padding-left:16px}
  /* PC: ให้แถบหัวโปร่งใส แล้วใช้พื้นหลังเฉพาะกล่อง 480px กึ่งกลาง มุมล่างโค้ง */
  #hdr{background:transparent;border-bottom:0}
  .hdr-in{background:var(--hdr);border-bottom:1px solid rgba(255,255,255,.12);border-radius:0 0 16px 16px}
  .wrap{padding-top:12px}
  .nav-in{max-width:480px;margin:0 auto}
  #bottomNav{left:50%;right:auto;width:480px;transform:translateX(-50%);border-radius:16px 16px 0 0}
  #toastRoot{left:50%;right:auto;width:480px;transform:translateX(-50%)}
  .modal{max-width:480px}
  .pin-modal{max-width:360px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hdr-in">
      <div class="logo" id="hdrLogo" data-id=""><span class="mi">shield</span></div>
      <div class="hdr-txt">
        <div class="hdr-sm">ตำรวจภูธรภาค 7</div>
        <div class="hdr-big">รวมระบบงาน ป.</div>
      </div>
      <button class="hdr-btn" id="bellBtn" data-act="bell" aria-label="แจ้งเตือน">
        <span class="mi">notifications</span>
        <span class="badge" id="bellBadge" hidden>0</span>
      </button>
      <button class="hdr-btn" id="keyBtn" data-act="key" aria-label="เข้าโหมด admin">
        <span class="mi" id="keyIcon">vpn_key</span>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <!-- หน้าหลัก -->
      <section id="view-home" class="view active">
        <!-- การ์ดวัน/วันที่/นาฬิกา: JS เติมเนื้อหาและสีตามค่าที่ admin ตั้ง -->
        <div id="heroHome" class="hero dark" aria-label="วันและเวลาปัจจุบัน"></div>
        <div id="ticker" class="ticker" hidden>
          <span class="mi">campaign</span>
          <div class="tk-view"><div class="tk-run" id="tickerRun"></div></div>
        </div>
        <div id="bannerWrap" class="banner-wrap" hidden>
          <div id="bannerTrack" class="banner-track"></div>
          <div id="bannerDots" class="banner-dots"></div>
        </div>
        <div class="card sys-card">
          <div class="card-head"><h2>ระบบงาน</h2></div>
          <div id="sysGrid" class="sys-grid"></div>
        </div>
        <div id="verLine" class="ver-line">รวมระบบงาน ป.</div>
      </section>

      <!-- เอกสารทั้งหมด -->
      <section id="view-docs" class="view">
        <h2 class="sec-title">เอกสารดาวน์โหลด</h2>
        <div class="search-box"><span class="mi">search</span><input id="docSearch" type="search" placeholder="ค้นหาชื่อเอกสาร" autocomplete="off" aria-label="ค้นหาเอกสาร"></div>
        <div id="docList"></div>
      </section>

      <!-- ค้นหาระบบ -->
      <section id="view-search" class="view">
        <h2 class="sec-title">ค้นหาระบบ</h2>
        <div class="search-box"><span class="mi">search</span><input id="searchInput" type="search" placeholder="พิมพ์ชื่อระบบที่ต้องการ" autocomplete="off" aria-label="ค้นหาระบบ"></div>
        <div id="searchList"></div>
      </section>

      <!-- ติดต่อ -->
      <section id="view-contact" class="view">
        <h2 class="sec-title">ติดต่อ</h2>
        <div id="contactList"></div>
      </section>

      <!-- แจ้งเตือน (เปิดจากกระดิ่งบน header) -->
      <section id="view-notif" class="view">
        <h2 class="sec-title">แจ้งเตือน</h2>
        <div id="notifList"></div>
      </section>

      <!-- ตั้งค่า -->
      <section id="view-settings" class="view">
        <h2 class="sec-title">ตั้งค่า</h2>
        <div id="settingsBody"></div>
      </section>

      <!-- หน้าย่อยของ admin -->
      <section id="view-sub" class="view">
        <div class="sub-bar">
          <button class="back-btn" data-act="back" aria-label="ย้อนกลับ"><span class="mi">arrow_back</span></button>
          <h2 id="subTitle">จัดการ</h2>
        </div>
        <div id="subBody"></div>
      </section>
    </div>
  </main>

  <nav id="bottomNav" aria-label="เมนูหลัก">
    <div class="nav-in">
      <button class="nav-b on" data-act="nav" data-view="home"><span class="mi">home</span><span class="nav-lbl">หน้าหลัก</span></button>
      <button class="nav-b" data-act="nav" data-view="docs"><span class="mi">folder_open</span><span class="nav-lbl">เอกสาร</span></button>
      <button class="nav-b nav-fab" data-act="nav" data-view="search" aria-label="ค้นหา"><span class="fab"><span class="mi">search</span></span><span class="nav-lbl">ค้นหา</span></button>
      <button class="nav-b" data-act="nav" data-view="contact"><span class="mi">call</span><span class="nav-lbl">ติดต่อ</span></button>
      <button class="nav-b" data-act="nav" data-view="settings"><span class="mi">settings</span><span class="nav-lbl">ตั้งค่า</span></button>
    </div>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<!-- ?v=3.0 กันมือถือค้างไฟล์เก่า (เปลี่ยนเลขเมื่อออกเวอร์ชันใหม่) -->
<script src="config.js?v=3.0"></script>
<script src="app.js?v=3.0"></script>
</body>
</html>
